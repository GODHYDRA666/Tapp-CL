<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.png">
<title>Tapp</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}
body {
  height: 100vh;
  background: #ffffff; 
  display: flex;
  justify-content: center;
  align-items: center;
}
/* CONTENEDOR */
.overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* CÍRCULO */
.loader {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
/* BORDE BASE */
.loader::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid rgba(0,0,0,0.25);
}
/* BORDE ANIMADO */
.loader::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top: 3px solid #01366c;
  border-left: 3px solid #01366c;
  animation: spin 1.2s linear infinite;
}
/* ANIMACIÓN GIRO */
@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
/* LOGO CENTRO */
.logo-center {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.logo-center img {
  width: 100%;
  height: auto;
}
/* TEXTO */
.loading-text {
  margin-top: 18px;
  font-size: 14px;
  color: #01366c;
  text-align: center;
  line-height: 1.4;
  opacity: 0.95;
}
/* ANIMACIÓN SUAVE DEL TEXTO */
.loading-text span {
  display: block;
  animation: fadeText 1.8s ease-in-out infinite;
}
@keyframes fadeText {
  0%,100% { opacity: 1; }
  50% { opacity: 0.6; }
}
/* CONTADOR */
.counter {
  margin-top: 30px;
  font-size: 48px;
  font-weight: bold;
  color: #01366c;
  text-align: center;
  min-width: 80px;
}
</style>
</head>
<body>
<div class="overlay">
  <div class="loader">
    <div class="logo-center">
      <!-- 🔥 USA TU LOGO BCP -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdc_9HGOeMRCeTZA896zcW_67szIDs0f_FjZ2_Wqa6TQYv8ja6bV8ClTw&s=10" alt="BCP">
    </div>
  </div>
  <br>
  <div class="loading-text">
    <span>Espere un momento</span>
    <span>por favor</span>
  </div>
  <div class="counter" id="counter">30</div>
</div>
<script>
  let contador = 30;
  
  const counterElement = document.getElementById('counter');
  
  const interval = setInterval(() => {
    contador--;
    counterElement.textContent = contador;
    
    if (contador === 0) {
      clearInterval(interval);
      window.location.href = "cod.html";
    }
  }, 1000);
</script>
</body>
</html>
